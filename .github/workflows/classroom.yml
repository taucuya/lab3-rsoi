name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@v2

      - name: Run unit tests
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r gateway/requirements.txt
          pip install -r flight_service/requirements.txt
          pip install -r ticket_service/requirements.txt
          pip install -r bonus_service/requirements.txt
          pytest gateway/tests flight_service/tests ticket_service/tests bonus_service/tests -v

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        timeout-minutes: 10
        run: ./scripts/test-script.sh
        env:
          VARIANT: v1
          SERVICE_NAME: bonus_service
          PORT_NUMBER: 8050

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOtoav-HWWtthJjnShIKnw3oIY"
          homework_number: 3
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
